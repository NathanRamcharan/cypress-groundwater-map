<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cypress Groundwater &amp; Subsidence Explorer — Prototype v2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#1E2A26;
    --ink-soft:#54615C;
    --line:#D9D2C0;
    --water:#2B6777;
    --water-soft:#DCE9EA;
    --ground:#AE5A28;
    --ground-soft:#F2E1D3;
    --creek:#3E6E4A;
    --creek-soft:#E1EAE0;
    --gap:#B7ADA0;
    --card:#FFFEFB;
    --live:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{
    display:grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    height:100vh;
  }
  header{
    padding:16px 24px 12px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    margin:0;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  header .sub{
    font-family:"Courier New",monospace;
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  .legend{
    display:flex;
    gap:16px;
    font-family:"Courier New",monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    align-items:center;
    flex-wrap:wrap;
    max-width:640px;
  }
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
  .legend .tri{
    display:inline-block;width:0;height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:10px solid var(--ground);
    margin-right:5px;
    vertical-align:-1px;
  }
  .legend .sq{
    display:inline-block;width:9px;height:9px;
    background:var(--creek);
    margin-right:5px;
    vertical-align:-1px;
  }
  main{
    display:grid;
    grid-template-columns: 1.5fr 1fr;
    min-height:0;
  }
  #map{ height:100%; width:100%; background:#eee; }
  aside{
    border-left:1px solid var(--line);
    overflow-y:auto;
    padding:20px 22px 40px;
    background:var(--card);
  }
  aside h2{
    font-size:1.05rem;
    margin:0 0 2px;
  }
  aside .kicker{
    font-family:"Courier New",monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .empty-state{
    color:var(--ink-soft);
    line-height:1.55;
    font-size:0.95rem;
  }
  .empty-state b{color:var(--ink);}
  .back-link{
    display:inline-block;
    font-family:"Courier New",monospace;
    font-size:0.72rem;
    color:var(--water);
    cursor:pointer;
    margin-bottom:10px;
    text-decoration:none;
  }
  .back-link:hover{ text-decoration:underline; }
  .loc-group-title{
    font-family:"Courier New",monospace;
    font-size:0.72rem;
    letter-spacing:0.03em;
    margin:20px 0 8px;
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .loc-group-title:first-of-type{ margin-top:4px; }
  .loc-item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:7px 4px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    font-size:0.88rem;
  }
  .loc-item:hover{ background:var(--paper); }
  .loc-dot{
    display:inline-block;
    width:9px;height:9px;
    border-radius:50%;
    flex:none;
  }
  .loc-tri{
    width:0;height:0;
    border-radius:0;
    border-left:5px solid transparent;
    border-right:5px solid transparent;
    border-bottom:8px solid var(--ground);
    background:none !important;
  }
  .loc-sub{
    color:var(--ink-soft);
    font-size:0.78rem;
    margin-left:auto;
    text-align:right;
    white-space:nowrap;
  }
  table.meta{
    width:100%;
    border-collapse:collapse;
    margin:14px 0 20px;
    font-size:0.85rem;
  }
  table.meta td{
    padding:5px 0;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  table.meta td:first-child{
    color:var(--ink-soft);
    width:42%;
    font-family:"Courier New",monospace;
    font-size:0.75rem;
    padding-right:10px;
  }
  .chart-wrap{
    background:var(--water-soft);
    border-radius:2px;
    padding:14px 10px 6px;
    margin-bottom:14px;
  }
  .chart-wrap.ground{ background:var(--ground-soft); }
  .badge-live{
    display:inline-block;
    background:var(--live);
    color:#fff;
    font-family:"Courier New",monospace;
    font-size:0.65rem;
    padding:2px 7px;
    border-radius:2px;
    margin-left:8px;
    vertical-align:2px;
    letter-spacing:0.03em;
  }
  .note{
    font-size:0.78rem;
    color:var(--ink-soft);
    line-height:1.5;
    border-left:2px solid var(--line);
    padding-left:10px;
    margin-top:10px;
  }
  .flood-flag{
    background:#F7E3E0;
    border-left:2px solid var(--live);
    padding:10px 12px;
    font-size:0.85rem;
    margin:10px 0 14px;
    line-height:1.5;
  }
  .no-data{
    font-size:0.9rem;
    color:var(--ink-soft);
    font-style:italic;
    padding:16px 0;
  }
  a.src{ color:var(--water); }
  .leaflet-popup-content{ font-family:"Iowan Old Style",Georgia,serif; font-size:0.85rem; }
  .leaflet-popup-content b{ display:block; margin-bottom:2px; }
</style>
</head>

function wellIcon(hasData, isLive){
  const color = isLive ? '#C0392B' : (hasData?'#2B6777':'#B7ADA0');
  const ring = isLive ? '0 0 0 3px rgba(192,57,43,.25)' : '0 0 0 1px rgba(0,0,0,.25)';
  return L.divIcon({
    className:'',
    html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:${ring};"></div>`,
    iconSize:[14,14], iconAnchor:[7,7]
  });
}
function stationIcon(){
  return L.divIcon({
    className:'',
    html:`<div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #AE5A28;filter:drop-shadow(0 0 1px rgba(0,0,0,.4));"></div>`,
    iconSize:[16,14], iconAnchor:[8,12]
  });
}
function creekIcon(flooded){
  const c = flooded ? '#C0392B' : '#3E6E4A';
  return L.divIcon({
    className:'',
    html:`<div style="width:12px;height:12px;background:${c};border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);"></div>`,
    iconSize:[12,12], iconAnchor:[6,6]
  });
}

  const has = w.readings.length > 1;
  panel.innerHTML = `
    <a class="back-link" onclick="renderList()">&larr; All locations</a>
    <div class="kicker">GROUNDWATER WELL</div>
    <h2>State Well ${w.id}${w.live?'<span class="badge-live">LIVE · USGS</span>':''}</h2>
    <table class="meta">
      <tr><td>Aquifer</td><td>${w.aquifer}</td></tr>
      <tr><td>Well depth</td><td>${w.depth} ft</td></tr>
      <tr><td>Coordinates</td><td>${w.lat.toFixed(4)}, ${w.lon.toFixed(4)}</td></tr>
      <tr><td>Record</td><td>${w.status}</td></tr>
      ${w.trend ? '<tr><td>Trend</td><td><b>'+w.trend+'</b></td></tr>' : ''}
    </table>
    ${has ? '<div class="chart-wrap"><canvas id="wellChart" height="220"></canvas></div>' :
      '<div class="no-data">No usable water-level series for this well — construction/casing details only, or a single spot reading.</div>'}
    ${w.note ? '<div class="note">'+w.note+'</div>' : ''}
    <div class="note">Source: TWDB Groundwater Database${w.live?' / USGS field-measurements API':''}, Well ${w.id.slice(0,2)}-${w.id.slice(2,4)}-${w.id.slice(4)}.</div>
  `;
  if (has){
    const ctx = document.getElementById('wellChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type:'line',
      data:{ datasets:[{
        label: w.mixedDatum ? 'Water level (ft, mixed datum)' : 'Depth to water (ft below surface)',
        data: w.readings.map(r=>({x:r[0], y:r[1]})),
        borderColor: w.live ? '#C0392B' : '#2B6777', backgroundColor: w.live ? '#C0392B' : '#2B6777',
        pointRadius:3, borderWidth:1.5, tension:0, showLine:true, spanGaps:false
      }]},
      options:{
        responsive:true,
        scales:{
          x:{ type:'linear', title:{display:true,text:'Year'}, ticks:{ callback:v=>Math.round(v) } },
          y:{ reverse: !w.mixedDatum, title:{display:true,text: w.mixedDatum ? 'ft' : 'ft below surface'} }
        },
        plugins:{ legend:{display:false} }
      }
    });
  }
}

function renderStationPanel(s){
  const panel = document.getElementById('panel');
  const has = s.readings.length > 1;
  panel.innerHTML = `
    <a class="back-link" onclick="renderList()">&larr; All locations</a>
    <div class="kicker">SUBSIDENCE GPS STATION</div>
    <h2>${s.id}</h2>
    <table class="meta">
      <tr><td>Monitoring since</td><td>${s.since}</td></tr>
      <tr><td>Total displacement</td><td>${s.totalCm} cm</td></tr>
      <tr><td>2025 rate</td><td>${s.rate2025} cm/yr</td></tr>
      <tr><td>Coordinates</td><td>${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}</td></tr>
      <tr><td>Trend</td><td>${s.note}</td></tr>
    </table>
    ${has ? '<div class="chart-wrap ground"><canvas id="stChart" height="220"></canvas></div>' :
      '<div class="no-data">Full time series not pulled for this prototype — summary stats above are real, sourced from the district\'s public feature service.</div>'}
    ${has ? '<div class="note">Approximate — points digitized by eye from the official HGSD/University of Houston chart to show trend shape. Exact daily values: <a class="src" href="https://hgsubsidence.org/GPS/2025/'+s.id+'_GOM25_neu_cm.png" target="_blank">hgsubsidence.org</a></div>' :
            '<div class="note">Source: HGSD AGOL_SubsRate21_25 feature service.</div>'}
  `;
  if (has){
    const ctx = document.getElementById('stChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type:'line',
      data:{ datasets:[{
        label:'Change in elevation (cm)',
        data: s.readings.map(r=>({x:r[0], y:r[1]})),
        borderColor:'#AE5A28', backgroundColor:'#AE5A28',
        pointRadius:2.5, borderWidth:1.5, tension:0.15, showLine:true
      }]},
      options:{
        responsive:true,
        scales:{
          x:{ type:'linear', title:{display:true,text:'Year'}, ticks:{ callback:v=>Math.round(v) } },
          y:{ title:{display:true,text:'cm change'} }
        },
        plugins:{ legend:{display:false} }
      }
    });
  }
}

function renderCreekPanel(c){
  const panel = document.getElementById('panel');
  panel.innerHTML = `
    <a class="back-link" onclick="renderList()">&larr; All locations</a>
    <div class="kicker">CYPRESS CREEK GAGE</div>
    <h2>Gage ${c.id}</h2>
    <table class="meta">
      <tr><td>Location</td><td>${c.name}</td></tr>
      <tr><td>Current level</td><td>${c.level} ft</td></tr>
      <tr><td>Flood stage</td><td>${c.floodStage ? c.floodStage+' ft' : 'not listed'}</td></tr>
      <tr><td>Coordinates</td><td>${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}</td></tr>
    </table>
    ${c.harveyFlood ? '<div class="flood-flag"><b>Hurricane Harvey, 8/31/2017 11:59 PM:</b><br>The district&#39;s own historical record shows this gage at status <b>"'+c.harveyFlood+'"</b> — confirmed active flooding at this exact location.</div>' : ''}
    <div class="note">Source: Harris County Flood Control District, Flood Warning System (harriscountyfws.org). Current level shown is a live reading, not historical.</div>
  `;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
}

const wellMarkers = {}, stationMarkers = {}, creekMarkers = {};

wells.forEach(w=>{
  const hasData = w.readings.length > 1;
  const marker = L.marker([w.lat,w.lon], {icon:wellIcon(hasData, w.live)})
    .addTo(map)
    .bindPopup(`<b>Well ${w.id}${w.live?' — LIVE':''}</b>${w.aquifer} · ${w.depth} ft`)
    .on('click', ()=>renderWellPanel(w));
  wellMarkers[w.id] = marker;
});

stations.forEach(s=>{
  const marker = L.marker([s.lat,s.lon], {icon:stationIcon()})
    .addTo(map)
    .bindPopup(`<b>${s.id}</b>${s.totalCm} cm since ${s.since}`)
    .on('click', ()=>renderStationPanel(s));
  stationMarkers[s.id] = marker;
});

creeks.forEach(c=>{
  const marker = L.marker([c.lat,c.lon], {icon:creekIcon(!!c.harveyFlood)})
    .addTo(map)
    .bindPopup(`<b>${c.name}</b>${c.level} ft${c.harveyFlood?' · Harvey: '+c.harveyFlood:''}`)
    .on('click', ()=>renderCreekPanel(c));
  creekMarkers[c.id] = marker;
});

function renderList(){
  const panel = document.getElementById('panel');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  let html = `
    <div class="kicker">ALL LOCATIONS</div>
    <h2>Cypress Data Explorer</h2>
    <div class="note" style="margin:8px 0 4px;">Click any item below, or a marker on the map, to see its data.</div>
  `;

  html += `<div class="loc-group-title" style="color:var(--water)">WELLS (${wells.length})</div>`;
  wells.forEach(w=>{
    const hasData = w.readings.length > 1;
    const color = w.live ? '#C0392B' : (hasData ? '#2B6777' : '#B7ADA0');
    html += `<div class="loc-item" data-type="well" data-id="${w.id}">
      <span class="loc-dot" style="background:${color}"></span>
      <span>Well ${w.id}${w.live?' <span class="badge-live" style="font-size:0.55rem;padding:1px 5px;">LIVE</span>':''}</span>
      <span class="loc-sub">${w.aquifer}${w.trend ? ' · ' + w.trend.split(' — ')[0] : ''}</span>
    </div>`;
  });

  html += `<div class="loc-group-title" style="color:var(--ground)">SUBSIDENCE STATIONS (${stations.length})</div>`;
  stations.forEach(s=>{
    html += `<div class="loc-item" data-type="station" data-id="${s.id}">
      <span class="loc-dot loc-tri"></span>
      <span>${s.id}</span>
      <span class="loc-sub">${s.totalCm} cm since ${s.since}</span>
    </div>`;
  });

  html += `<div class="loc-group-title" style="color:var(--creek)">CREEK GAGES (${creeks.length})</div>`;
  creeks.forEach(c=>{
    const color = c.harveyFlood ? '#C0392B' : '#3E6E4A';
    html += `<div class="loc-item" data-type="creek" data-id="${c.id}">
      <span class="loc-dot" style="background:${color}"></span>
      <span>${c.name}</span>
      <span class="loc-sub">${c.harveyFlood ? 'Harvey: flooded' : c.level + ' ft'}</span>
    </div>`;
  });

  panel.innerHTML = html;

  panel.querySelectorAll('.loc-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const type = el.dataset.type, id = el.dataset.id;
      let marker, data;
      if (type === 'well') { data = wells.find(x=>x.id===id); marker = wellMarkers[id]; renderWellPanel(data); }
      else if (type === 'station') { data = stations.find(x=>x.id===id); marker = stationMarkers[id]; renderStationPanel(data); }
      else { data = creeks.find(x=>x.id===id); marker = creekMarkers[id]; renderCreekPanel(data); }
      map.panTo(marker.getLatLng());
      marker.openPopup();
    });
  });
}

renderList();

</script>
</body>
</html>
